<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        body{
            display: cover;
            font-family: Arial;
        }
        .shade{
            height: 100vh;
            background-color: rgba(0,0,0,0.7);
            margin-left: -10px;
            margin-top: -10px;
            width: 101.4%;
        }
        header{
            display: flex;
            padding-top:20px;
            justify-content: space-between;
        }
        .brand-title{
            font-size: 40px;
            font-family: Arial;
            color: red;
            font-weight: bold;
            margin-left: 100px;

        }
        .lang{
            color: white;
            display: inline-block;
            padding: 5px;
            border: 1px solid gray;
        }
        .btn-signin{
            color: white;
            padding: 5px;
            display: inline-block;
            background-color: red;
            border-radius: 5px;
            margin-left: 10px;
            margin-right: 100px;
            width: 80px;
            text-align: center;
        }
        section{
            text-align: center;
        }
        .section-title{
            font-weight: bold;
            color: white;
            text-align: center;
            margin-top: 100px;
            font-size: 56px;
        }
        .section-subtitle{
            color: white;
            text-align: center;
            margin-top: 15px;
            font-size: 18px;
        }
        .main-title{
            text-align: center;
            color:white;
            font-size: 16px;
            margin-top: 35px;
        }
        .main{
            margin-top: 30px;
        }
        .main-title {
         margin-bottom: 20px;
       }
        .email{
            display: inline-block;
            width: 300px;
            padding: 20px;
            text-align: left;
            color: white;
            border: 1px solid white;
            border-radius: 5px;
            background-color: rgba(33, 32, 32, 0.7);
        }
        .btn-start{
            color: white;
            background-color: red;
            display: inline-block;
            width: 180px;
            padding: 20px;
            border-radius: 5px;
            margin-left: 10px;
            font-size: 20px;
        }
    </style>
</head>
<body background="./images/netflix-banner.jpg">
    <div class="shade">
        <header>
            <div>
                <span class="brand-title">NETFLIX</span>
            </div>
            <div>
                <span class="lang"><span class="bi bi-translate"></span><span> English </span><span class="bi bi-chevron-down"></span></span>
                <span class="btn-signin">Sign In</span>
            </div>
        </header>
        <section>
            <div>
                <div class="section-title">Unlimited movies, TV <br>shows and more</div>
                <div class="section-subtitle">Starts at ₹149. Cancel at any time.</div>
            </div>
            <main>
                <div class="main-title">Ready to watch? Enter your email to create or restart your membership.</div>
                <div>
                    <span class="email">Email Address</span>
                    <span class="btn-start">Get Start <span class="bi bi-chevron-right"></span></span>
                </div>
            </main>
        </section>
    </div>
</body>
</html>
