<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        dt {
            font-weight: bold;
            background-color: black;
            color:white;
            padding: 5px;
            margin-bottom: 10px;
        }
        dd {
            font-weight: bold;
            background-color: gray;
            color:white;
            padding: 5px;
            margin-bottom: 10px;
        }
        dl {
            display: grid;
            grid-template-columns: 6fr 6fr;
        }
        fieldset {
            box-shadow: 2px 2px 2px gray;
            margin: 20px;
            border: 4px double black;
        }
        legend {
            text-align: center;
            background-color: black;
            color:white;
            padding: 5px;
            border-radius: 10px;
            width: 140px;
            box-shadow: 2px 2px 2px gray;
        }
    </style>
</head>
<body>
    <fieldset>
        <legend>Personal Details</legend>
        <dl>
            <dt>First Name</dt>
            <dd>some name</dd>
            <dt>Last Name</dt>
            <dd>some name</dd>
        </dl>
    </fieldset>
    <fieldset>
        <legend>Contact Details</legend>
        <dl>
            <dt>City</dt>
            <dd>some</dd>
            <dt>State</dt>
            <dd>some</dd>
        </dl>
    </fieldset>
</body>
</html>
