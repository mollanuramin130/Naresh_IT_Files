<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .header-div{
            background-color: red;
            text-align: center;
            font-weight: bold;
            width: 100%;
            height: 60px;
            font-size: 22px;
        }
        section{
            display: grid;
            grid-template-columns: 2fr 10fr;
            height: 530px;
            margin-top: 5px;
        }
        .side-nav{
            background-color: blue;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            margin-right: 3px;
            font-weight: bold;
        }
        .main-content{
            background-color: yellow;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .footer-container{
            background-color: green;
            width: 100%;
            margin-top: 5px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            height: 60px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-div">Header</div>
    </header>
    <section>
        <nav>
            <div class="side-nav">Side Navigation</div>
        </nav>
        <main>
            <div class="main-content">Main Content</div>
        </main>
    </section>
    <footer>
        <div class="footer-container">Footer</div>
    </footer>
</body>
</html>
